name: Security check

on:
  pull_request:
  schedule:
    - cron: "0 3 * * 1"

jobs:
  audit:
    name: Dependency audit and secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Dependency audit
        run: bun audit --audit-level=high

      - name: Fail if committed env files exist
        run: |
          if git ls-files | grep -E '^\.env(\.|$)' | grep -v '\.env\.example'; then
            echo "Environment files must never be committed."
            exit 1
          fi

      - name: Scan for hardcoded secrets
        run: |
          if git grep -nIE 'sb_secret_|service_role|-----BEGIN [A-Z ]*PRIVATE KEY-----' -- . ':!*.md' ':!.github/**' ':!src/integrations/supabase/client.server.ts' ':!src/integrations/supabase/auth-middleware.ts'; then
            echo "Potential secret found in source."
            exit 1
          fi
