name: Native packages

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.3
      - run: bun install --frozen-lockfile
      - run: bun run native:verify

  android:
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.3
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"
      - run: bun install --frozen-lockfile
      - run: bun run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
      - run: bunx cap sync android
      - name: Configure Android release signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD_SECRET: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS_SECRET: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD_SECRET: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -n "$ANDROID_KEYSTORE_BASE64" && -n "$ANDROID_KEYSTORE_PASSWORD_SECRET" && -n "$ANDROID_KEY_ALIAS_SECRET" && -n "$ANDROID_KEY_PASSWORD_SECRET" ]]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/smartpos-release.jks"
            KEYSTORE_PASSWORD="$ANDROID_KEYSTORE_PASSWORD_SECRET"
            KEY_ALIAS="$ANDROID_KEY_ALIAS_SECRET"
            KEY_PASSWORD="$ANDROID_KEY_PASSWORD_SECRET"
          else
            KEYSTORE_PASSWORD="smartpos-ci-only"
            KEY_ALIAS="smartpos-ci"
            KEY_PASSWORD="smartpos-ci-only"
            keytool -genkeypair -v -keystore "$RUNNER_TEMP/smartpos-release.jks" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" -keypass "$KEY_PASSWORD" -keyalg RSA -keysize 2048 -validity 30 -dname "CN=SmartPOS CI,OU=Build,O=SmartPOS,L=Cairo,C=EG"
            echo "::warning::Android signing secrets are not configured. Artifacts use a temporary CI key and cannot update an installed production build."
          fi
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/smartpos-release.jks" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Build release APK and AAB
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease bundleRelease
      - name: Verify and name Android artifacts
        shell: bash
        run: |
          test -s android/app/build/outputs/apk/release/app-release.apk
          test -s android/app/build/outputs/bundle/release/app-release.aab
          test "$(stat -c%s android/app/build/outputs/apk/release/app-release.apk)" -gt 1000000
          test "$(stat -c%s android/app/build/outputs/bundle/release/app-release.aab)" -gt 1000000
          mkdir -p release
          cp android/app/build/outputs/apk/release/app-release.apk release/SmartPOS-Android.apk
          cp android/app/build/outputs/bundle/release/app-release.aab release/SmartPOS-Android.aab
      - uses: actions/upload-artifact@v7
        with:
          name: SmartPOS-Android
          path: release/SmartPOS-Android.*
          if-no-files-found: error
          retention-days: 14

  desktop:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
            arch: x64
            build-command: bunx electron-builder --linux AppImage deb --x64
          - os: windows-2025
            platform: windows
            arch: x64
            build-command: bunx electron-builder --win nsis --x64
          - os: macos-15
            platform: macos
            arch: arm64
            build-command: bunx electron-builder --mac dmg --arm64
          - os: macos-15
            platform: macos
            arch: x64
            build-command: bunx electron-builder --mac dmg --x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.3
      - run: bun install --frozen-lockfile
      - run: bun run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
      - name: Build installer
        run: ${{ matrix.build-command }}
      - name: Verify installer files
        run: bun run verify:artifacts ${{ matrix.platform }}
      - uses: actions/upload-artifact@v7
        with:
          name: SmartPOS-${{ matrix.platform }}-${{ matrix.arch }}
          path: release/SmartPOS-*
          if-no-files-found: error
          retention-days: 14
