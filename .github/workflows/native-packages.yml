name: Native packages

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3
      - run: bun install --frozen-lockfile
      - run: bun run native:verify

  android:
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - run: bun install --frozen-lockfile
      - run: bunx cap sync android
      - run: cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v6
        with:
          name: SmartPOS-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  desktop:
    needs: verify
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
            arch: x64
          - os: windows-2025
            platform: win32
            arch: x64
          - os: macos-15
            platform: darwin
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3
      - run: bun install --frozen-lockfile
      - run: bunx electron-packager . SmartPOS --platform=${{ matrix.platform }} --arch=${{ matrix.arch }} --out=native-release --overwrite --prune=true --ignore='^/src' --ignore='^/android' --ignore='^/dist' --ignore='^/native-release'
      - uses: actions/upload-artifact@v6
        with:
          name: SmartPOS-${{ matrix.platform }}-${{ matrix.arch }}
          path: native-release/
          if-no-files-found: error